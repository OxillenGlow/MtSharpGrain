plugins {
    id 'java'
    id 'application'
    id "io.github.0ffz.github-packages" version "1.2.1"
}

group = 'com.mtsharpgrain'
version = '0.1.0-beta4'

application {
    applicationName = 'MtSharpGrain'
    mainClass = 'com.mtsharpgrain.Main'
    // -XstartOnFirstThread is macOS-only — handled conditionally below,
    // not baked in here, so Windows/Linux launches aren't broken
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    flatDir {
        dirs 'libs'
    }
}

project.ext {
    jmeVer = '3.9.0-stable'
}

project(":assets") {
    apply plugin: "java"

    layout.buildDirectory.set(rootProject.file("build/assets"))

    sourceSets {
        main {
            resources {
                srcDir '.'
            }
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
}

dependencies {
    // Core JME
    implementation "org.jmonkeyengine:jme3-core:$jmeVer"
    implementation "org.jmonkeyengine:jme3-desktop:$jmeVer"

    if (!System.getProperty("os.name").toLowerCase().contains("mac")) {
        implementation "org.jmonkeyengine:jme3-awt-dialogs:$jmeVer"
    }
    implementation "org.jmonkeyengine:jme3-lwjgl3:$jmeVer"

    implementation "org.jmonkeyengine:jme3-jogg:$jmeVer"
    implementation "org.jmonkeyengine:jme3-plugins:$jmeVer"
    implementation "org.jmonkeyengine:jme3-jbullet:$jmeVer"
    implementation "org.jmonkeyengine:jme3-networking:$jmeVer"
    implementation "org.jmonkeyengine:jme3-effects:$jmeVer"
    implementation "org.jmonkeyengine:jme3-terrain:$jmeVer"
    implementation "org.jmonkeyengine:jme3-testdata:$jmeVer"
    implementation "com.epagagames:particlemonkey:1.1.0"
    implementation "com.github.polincdev:ShaderBlowEx:-SNAPSHOT"
    implementation "org.graalvm.polyglot:polyglot:24.1.1"
    implementation "org.graalvm.polyglot:js-community:24.1.1"

    implementation fileTree(dir: 'libs', include: ['*.jar'])

    runtimeOnly project(':assets')
}

jar {
    manifest {
        attributes 'Main-Class': application.mainClass
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

wrapper {
    gradleVersion = '8.6'
}

// ./gradlew run — only add the mac flag when actually building/running on a Mac
tasks.withType(JavaExec).configureEach {
    if (System.getProperty("os.name").toLowerCase().contains("mac")) {
        jvmArgs += ['-XstartOnFirstThread']
    }
}

// distZip/installDist generate one shared unix launch script that has to work
// on both macOS and Linux — so the mac flag has to be checked at *runtime*
// (inside the script, via uname) rather than baked in at build time.
tasks.named('startScripts').configure {
    doLast {
        def macBlock = '''if [[ "$(uname)" == *"Darwin"* ]]; then
    DEFAULT_JVM_OPTS="$DEFAULT_JVM_OPTS \\"-XstartOnFirstThread\\""
fi
'''
        unixScript.text = unixScript.text.replaceFirst(/(?m)^DEFAULT_JVM_OPTS=.*$/) { line ->
            "${line}\n${macBlock}"
        }
    }
}

tasks.register('jpackage') {
    dependsOn 'installDist'
    doLast {
        def installLibDir = layout.buildDirectory.dir("install/${application.applicationName}/lib").get().asFile
        def outputDir = layout.buildDirectory.dir("jpackage").get().asFile
        outputDir.mkdirs()

        def os = System.getProperty("os.name").toLowerCase()
        def type
        def extraArgs = []
        if (os.contains("mac")) {
            type = "dmg"
            extraArgs += ["--java-options", "-XstartOnFirstThread"]
        } else if (os.contains("win")) {
            type = "exe"
        } else {
            type = "deb"
        }

        // jpackage's macOS bundler rejects a leading-zero major version (e.g. "0.1.0"),
        // so remap to a 1.x-based version string just for the package metadata —
        // this doesn't change project.version anywhere else
        def rawVersion = project.version.toString().tokenize('-')[0]  // e.g. "0.1.0"
        def versionParts = rawVersion.tokenize('.')
        if (versionParts[0] == '0') {
            versionParts[0] = '1'
        }
        def cleanVersion = versionParts.join('.')
        exec {
            commandLine "jpackage",
                "--type", type,
                "--input", installLibDir.absolutePath,
                "--dest", outputDir.absolutePath,
                "--name", application.applicationName,
                "--main-jar", tasks.jar.archiveFileName.get(),
                "--main-class", application.mainClass.get(),
                "--app-version", cleanVersion,
                *extraArgs
        }
    }
}
tasks.named('run', JavaExec) {
    doFirst {
            
        println "JVM ARGS: ${jvmArgs}"
    }
}

