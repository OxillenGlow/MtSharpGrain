plugins {
    id 'java'
    id 'application'
    id "io.github.0ffz.github-packages" version "1.2.1"
}

group = 'com.mtsharpgrain'
version = '1.0'

application {
    applicationName = 'MtSharpGrain'
    mainClass = 'com.mtsharpgrain.Main'
    // Mac OS with LWJGL 3 needs to be started with this JVM argument
    if (System.getProperty("os.name").toLowerCase().contains("mac")) {
        applicationDefaultJvmArgs = ['-XstartOnFirstThread']
    }
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    // Sourceforge does not host a standard Maven repository layout. Removed to prevent build timeouts.
    maven githubPackage.invoke("riccardobl")
}

project.ext {
    jmeVer = '3.8.1-stable'
}

project(":assets") {
    apply plugin: "java"

    // Modern Gradle syntax for layout build directory
    layout.buildDirectory.set(rootProject.file("build/assets"))

    sourceSets {
        main {
            resources {
                srcDir '.'
            }
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
}

dependencies {
    // Core JME
    implementation "org.jmonkeyengine:jme3-core:$jmeVer"
    implementation "org.jmonkeyengine:jme3-desktop:$jmeVer"
    
    // Mac OS with LWJGL 3 doesn't allow AWT/Swing
    if (!System.getProperty("os.name").toLowerCase().contains("mac")) {
        implementation "org.jmonkeyengine:jme3-awt-dialogs:$jmeVer"
    }
    implementation "org.jmonkeyengine:jme3-lwjgl3:$jmeVer"

    // Suppress errors / warnings building in SDK
    implementation "org.jmonkeyengine:jme3-jogg:$jmeVer"
    implementation "org.jmonkeyengine:jme3-plugins:$jmeVer"
  
    // GUI Library
    implementation "org.jmonkeyengine:jme3-niftygui:$jmeVer"
  
    // Physics Library
    implementation "org.jmonkeyengine:jme3-jbullet:$jmeVer"

    // Additional Libraries
    implementation "org.jmonkeyengine:jme3-effects:$jmeVer"
    implementation "org.jmonkeyengine:jme3-terrain:$jmeVer"
    implementation "org.jmonkeyengine:jme3-testdata:$jmeVer"
    implementation "org.jmonkeyengine:jme3-vr:$jmeVer"
    implementation "com.github.stephengold:Heart:9.2.0"
    implementation "com.epagagames:particlemonkey:1.1.0"
    implementation "com.github.polincdev:ShaderBlowEx:-SNAPSHOT"
    
    // Fixed Neuroph text error by commenting out the orphaned header line
    // Neuroph Core
    // implementation 'org.neuroph:neuroph-core:2.96'
    
    // Required for Neuroph to output errors/logs to your console
    // implementation 'org.slf4j:slf4j-simple:1.7.36'

    // The "Interface" (often pulled automatically by Neuroph)
    // implementation 'org.slf4j:slf4j-api:1.7.36'
    // The "Implementation" (actually prints the messages to your console)
    // implementation 'org.slf4j:slf4j-simple:1.7.36'
    // implementation files("${rootProject.projectDir}/bin/jVisualScripting-editor-1.4.jar")
    // implementation files("${rootProject.projectDir}/bin/jVisualScripting-1.4.jar")
    
    // Fixed: Changed single quotes to double quotes for variable interpolation. 
    // Note: You must replace '1.0.0' with your actual target version of jme-igui.
    implementation 'com.github.riccardobl:jme-igui:0.1.2'
    //implementation "wf.frk:jme-igui:${jmeVer}"
    
    // Assets sub-project
    runtimeOnly project(':assets')
}

jar {
    manifest {
        attributes 'Main-Class': application.mainClass
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

wrapper {
    gradleVersion = '8.6'
}
